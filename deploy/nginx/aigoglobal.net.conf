server {
    listen 80;
    listen [::]:80;
    server_name aigoglobal.net www.aigoglobal.net;
    return 301 https://aigoglobal.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aigoglobal.net;

    ssl_certificate /etc/nginx/ssl/aigoglobal.net.pem;
    ssl_certificate_key /etc/nginx/ssl/aigoglobal.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://aigoglobal.net$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aigoglobal.net;

    ssl_certificate /etc/nginx/ssl/aigoglobal.net.pem;
    ssl_certificate_key /etc/nginx/ssl/aigoglobal.net.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    client_max_body_size 1m;
    access_log /var/log/nginx/aigoglobal.access.log;
    error_log /var/log/nginx/aigoglobal.error.log warn;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
    }
}
